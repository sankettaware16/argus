# ARGUS configuration (non-secret). Secrets go in .env — see .env.example.
# Any key can be overridden by an environment variable: ARGUS_<SECTION>__<KEY>.
# Every setting is described in docs/configuration.md.

environment: dev

history:
  # How far back ARGUS looks (backfill depth and entity-history lookback).
  # Examples: 4d, 5d, 30d, 36h (allowed range 1h to 365d). Keep it at or below the log retention
  # on the SIEM (its ILM policy).
  window: 5d

memory:
  # How long ARGUS keeps alerts, entity facts and baselines locally. Older investigations go with
  # the retention purge, unless held.
  window: 90d

retention:
  # Personal data the purge removes; each period is at least history.window in effect. Held:
  # open cases, pending approvals, the gold set. Audit events and case records stay.
  # `argus purge plan` shows the counts.
  raw_source: 30d   # an alert's raw _source (its normalized form stays until memory.window)
  evidence: 90d     # evidence snapshots, from the investigation's newest review
  quarantine: 30d   # a quarantined alert's raw _source
  app_logs: 14d     # the systemd journal: set by a root step (docs/runbooks/retention.md)

database:
  # Connection details (host, port, name, user, password) live in .env, shared with
  # docker compose — values there take precedence over this file.
  pool_size: 5
  max_overflow: 5
  connect_timeout: 5s
  statement_timeout: 30s

logging:
  level: INFO
  format: console   # console (human) or json (machines)

assets:
  # The asset map, imported with `argus assets import <file>` (local only, never committed); the
  # default is data/assets/asset_map.yaml. The older campus_prefixes setting is deprecated: use
  # site.own_networks.

reference:
  # The site's mirror sources (site.ti_sources) sync every 6 h; its lookup sources are asked as
  # investigations need them.
  ti_sync: true

enrichment:
  # The web follow-up search and the proxy aggregations, each asked once per investigation.
  log_queries: true
  proxy_aggregations: true

# siem: the SIEM's Elasticsearch. There is no default address: the url and the read-only key's
# expiry (api_key_expires; `argus doctor` warns 30 days ahead and never asks the SIEM) go in
# config/local.yaml, the key itself in .env.

# site: everything about this organisation's Elastic that is not code (log families, space,
# threat-intel sources, versions, time zone, quiet hours, names). `argus discover` proposes the
# section from a fresh Elastic and `--write` puts it in config/site.yaml, which is read beside
# this file. It lives there, not here. See docs/configuration.md for every key.

# backup: dumps go to data/backups/ (never committed); the nightly dump and the weekly restore
# drill are argus-backup.timer and argus-backup-drill.timer (deploy/systemd). The dump before
# every `argus db upgrade`/`downgrade` is switched on in production's own .env
# (ARGUS_BACKUP__BEFORE_MIGRATION=true), never here: every checkout loads this file, and a dump
# started from one must never reach another checkout's database server through docker compose.

# freshness: watermarks and verified zeros. "off" until switched on (docs/runbooks/freshness.md);
# the margins come from scripts/derive_margin.py. "on" lets a log zero say "nothing found".
freshness:
  mode: "off"

# web: doctor alarms when the served certificate differs from web.tls_pin_sha256, this
# installation's own pin (config/local.yaml).

# cases: the daily still-active watch of open true-positive cases, off until switched on.
# "local": ARGUS's own alerts only (nothing reaches the SIEM); "on": also the proxy logs. The
# command is `argus case watch run`, once a day (docs/runbooks/case-watch.md).
#   suggest: `argus assess run` suggests a case every 15 minutes from evidence across
#     investigations (several devices that reached one flagged destination or one operator's
#     domains; a host in Needs attention seen by several rules or on several days; actors that hit
#     the same rare targets): a suspected case a person confirms or dismisses. ARGUS opens nothing.
#     What an open case holds is never suggested into a new one. Local reads only.
#   offers_per_hour: offers of a new device's investigations to an open case an hour, one for each
#     device.
cases:
  watch: "off"
  suggest: true
  offers_per_hour: 30
  retitle: true

# campaigns: devices that reach the same rare domains.
#   resolvers: the recursive DNS resolvers, addresses or networks. A resolver asks for every name
#     its users ask for, so it is no device and would join unrelated campaigns. SET THIS to the
#     resolvers your DNS alerts show as the client. Example: resolvers: [10.0.0.53, 10.0.0.54].
campaigns:
  resolvers: []

# notified: a case whose owner was told. Such devices are mostly personal and cannot be forced
# clean, so a notified case is tracked quietly: its alerts are counted, not raised, and ARGUS
# speaks again only on change. All days are counted from the notice.
#   renotify_days / network_days: still active this long -> a suggestion to notify again / to ask
#     for network-side action (the case's block list); never an alarm.
#   quiet_days: no matching activity this long -> ARGUS proposes closing the case as "stopped
#     after notice" (a person approves). active_days: activity within this many days is "still
#     active".
#   move_gap / move_window / move_similarity: the same indicators from a new address that began
#     between move_gap and move_window after an old one went quiet, and are this alike (0 to 1),
#     are probably the same device.
#   volume_factor: traffic this many times the level at the notice (or at the last spoken change)
#     is a change (judged only when the evidence carries bytes).
#   managed_types: the asset map's site.type values of managed machines; any other type, and an
#     address the map does not know, is personal.
#   reopen_days: how long after a "stopped" closure new activity counts as a change again.
#     per_pass: investigations one pass reads for one case.
notified:
  renotify_days: 7
  network_days: 21
  quiet_days: 14
  active_days: 3
  move_gap: 2h
  move_window: 72h
  move_similarity: 0.8
  volume_factor: 10
  managed_types: [lab, computer-room]
  reopen_days: 30
  per_pass: 500

# incident: ARGUS writes the incident report of each suggested or open case (summary, verdict,
# timeline, actors, assets, evidence with the query behind each line, hypotheses, indicators,
# actions) from its own database; a person confirms or rejects it. It asks the SIEM and Kibana
# nothing: the queries are text, and the links only open a page a signed-in person may see.
#   per_pass / look: reports written / cases examined in one assessment pass. min_interval: a case
#     is not written again sooner than this after its last report.
#   prose: let a model word the summary from verified facts, through the LLM gateway and the
#     citation checks (any refusal leaves the deterministic text).
#   kibana_url, data_views: where the evidence links open (docs/configuration.md).
incident:
  enabled: true
  per_pass: 5
  look: 40
  min_interval: 30m
  prose: false

# kibana: the Kibana lane stays off here (kibana.enabled false); only argus-kibana-sync and
# argus-case-team turn it on, in their own environment files (local/, never .env).
# url: the address of this installation's Kibana (config/local.yaml; no default).
kibana:
  sync:
    enabled: true  # the read-back and the Verdict: comments, where kibana.enabled is true

# case_team: Kibana users (docs/runbooks/kibana-case-team.md) post an incident case.
# `post: false` writes nothing to the SIEM: the rendering still runs as a dry run
# (`argus case team preview <n>`). The writers' own credentials are secrets, never here.
case_team:
  post: false
  auto: false  # only a person's confirm opens a Kibana case
  auto_min_confidence: 0.8
  per_day: 5
  canary: 1

# notices: e-mails that carry a link, a severity and a count (never a name) through your mail
# relay. Off until you approve the relay and the recipients (docs/runbooks/notices.md). They go in
# the production .env, never here: ARGUS_NOTICES__ENABLED, ARGUS_NOTICES__RELAY_HOST,
# ARGUS_NOTICES__RELAY_PORT, ARGUS_NOTICES__RELAY_FROM,
# ARGUS_NOTICES__RECIPIENTS=a@example.org,b@example.org, ARGUS_NOTICES__WEB_URL, and the relay
# login ARGUS_NOTICES__USER / ARGUS_NOTICES__PASSWORD if it needs one.
notices:
  enabled: false

# investigation: the deterministic wave. For an undecided investigation with a closable gap ARGUS
# asks the ranked checks through the investigation lane before any model is asked. Off until the
# first supervised wave; "Check more" (a person's request) does not depend on it.
investigation:
  wave: false

# signins: who was behind an internal address. ARGUS reads the SSO sign-in logs (the site's auth
# family) for the addresses of its investigations, a few requests a pass, and keeps the accounts
# that signed in from each address each UTC day. Usernames are personal data: shown only with log
# access, never sent to any model (docs/runbooks/signins.md). Further knobs, if ever needed:
# actions (the browser and interactive sign-in events), pad_hours (2), shared_accounts (4),
# batch (200), max_requests_per_pass (6), gap (3s), current_day_every (1h), retention_days (5:
# how long the logs are kept), keep_days (180: how long ARGUS keeps the accounts), final_after
# (3h: a finished day is final once looked up this long after its end).
signins:
  enabled: true

# outside: VirusTotal, Shodan and Censys, looked up only for outside addresses and names, at most
# once a week each (the cache; a day for "no record"), within limits below the free plans. The
# keys are secrets and go in .env only (ARGUS_OUTSIDE__VIRUSTOTAL_API_KEY,
# ARGUS_OUTSIDE__SHODAN_API_KEY, ARGUS_OUTSIDE__CENSYS_API_KEY); a source without a key is off.
# The defaults suit the free plans; further knobs (a value above a plan's limit is refused):
#   virustotal_per_minute (3), virustotal_per_day (400), shodan_per_minute (30),
#   shodan_per_day (200), censys_per_day (10), censys_per_month (50), cache_window (7d: a
#   detection, a server's description), clean_cache_window (1d: no record, or too few engines,
#   so a fresh server is looked at again), error_backoff (6h: no usable answer, not asked again),
#   flag_threshold (3 VirusTotal engines make a detection), prefetch (true: look up the
#   destinations of beacon-flagged investigations), prefetch_per_day (260), prefetch_batch (3),
#   families_per_day (40: VirusTotal requests a day for domain families, the registered parent of
#   many names and then its first address; 0 switches them off; 40 + 260 leave the investigator
#   100 of the 400), shodan_internetdb (true: with no Shodan key the shodan source asks Shodan's
#   free InternetDB, which needs none).
