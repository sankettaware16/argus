# The LLM gateway (docs/llm.md). Non-secret: the keys are read from keys_file by name and never
# shown. Providers are tried in this order: the free ones first, the paid ones last. A provider
# without the asked-for tier is skipped. Limits are the providers' published or observed limits;
# ARGUS uses `margin` of them. Prices are USD per million tokens (check the providers' pages);
# the gpt-5.5 price is set high on purpose, so the monthly cap errs on the safe side.
#
# Per provider, optionally: trust (cloud | campus), ca_file (trust that certificate only),
# timeout_s (one call's deadline), concurrency (calls in flight across every ARGUS process),
# tasks (the allowlist of Call.purpose; default every task), probe (GET /v1/models before calls),
# schema_output, slow_s (a model whose median latency is above it cools down for 30 minutes),
# api (openai, the default, or anthropic, with api_version), monthly_cap_usd and daily_cap_usd
# (its own paid spend, at most the overall caps) and bytes_per_token (1 to 4: the body bytes
# counted as a prompt token in its rate limits only; the cost reserved always counts a byte a token).
# Per model: context_tokens, thinking_tokens (room for the reasoning a model writes before its
# answer) and max_output.

# null: every model feature is off and ARGUS investigates deterministically;
# `argus init` writes this installation's keys file into llm.local.yaml
keys_file: null
monthly_cap_usd: 40.0  # paid spend per month
daily_cap_usd: 1.50  # paid spend per day: a backlog cannot spend the month in a day
margin: 0.8  # the fraction of each provider limit ARGUS uses
shares: {high: 1.0, normal: 0.8, low: 0.5}  # the fraction of each day limit and of the monthly cap a priority may use
# The evaluation budget: purpose "evaluate" goes at low priority, only inside window_utc, and at
# most calls_per_day a night per provider, so a long evaluation run spreads over nights and
# resumes rather than using up a provider's day. The window lies in one UTC day (the cap counts
# per UTC day) and outside quiet hours.
evaluation:
  window_utc: ["17:30", "00:00"]  # "00:00" as the end: midnight
  calls_per_day: 150

# One task's own settings (D-324): calls_per_day caps its attempts a UTC day over every provider
# (each provider tried counts one); providers, the only ones that serve it, in the order tried;
# tier, the model size it asks for. ARGUS AI's reading of a presented incident: "story" (what
# happened, the case against it, one incident or two, next steps) and "opinion" (a second
# opinion on P1 incidents). Text only: neither changes the queue. Put anthropic first in a
# list to have Sonnet 5.5 / Opus 5.5 write them instead of gpt-5.4-mini / gpt-5.5.
purposes:
  story: {calls_per_day: 15, tier: medium, providers: [openai, anthropic]}
  opinion: {calls_per_day: 3, tier: large, providers: [openai, anthropic]}
  # The analyst brief of an incident report (D-332): a large model words what happened, why
  # it is real, the impact and the steps asked for; code checks every line against the facts.
  brief: {calls_per_day: 12, tier: large, providers: [anthropic, openai]}

providers:
  - name: groq  # one organisation: both keys share one quota
    base_url: https://api.groq.com/openai/v1
    keys: [GROQ_API_KEY, GROQ_API_KEY_2]
    timeout_s: 120
    max_tokens_field: max_completion_tokens
    # Its 263 answered assess prompts (21 Oct-4 Nov) ran at least 3.4 bytes a token (3.7 on
    # average). At a byte a token no prompt above 4,868 bytes (4,368 on medium) fitted a minute
    # with its answer's cap; at 2, up to 9,736 (8,736) do, still counted high. Its tokens cost
    # nothing.
    bytes_per_token: 2
    models:
      small: {name: openai/gpt-oss-20b, limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}}
      medium: {name: openai/gpt-oss-120b, limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}}

  - name: openrouter  # free models: 20 a minute and 50 a day for the whole account
    base_url: https://openrouter.ai/api/v1
    keys: [OPENROUTER_API_KEY]
    timeout_s: 120
    max_tokens_field: max_tokens
    # Free models come and go: a model that answers 404 raises a model_mismatch alarm (doctor).
    # The medium model reasons before it answers: thinking_tokens keeps its answer from being cut.
    models:
      small: {name: "google/gemma-4-31b-it:free"}
      medium: {name: "nvidia/nemotron-3-ultra-550b-a55b:free", thinking_tokens: 4096}
    limits: {rpm: 20, rpd: 50}

  - name: gemini  # last of the free: its free prompts may improve Google's products
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    keys: [GEMINI_API_KEY]
    timeout_s: 120
    max_tokens_field: max_tokens
    models:
      small: {name: gemini-3.5-flash-lite, limits: {rpm: 10, rpd: 500, tpm: 250000}}
      # the circuit breaker is per provider, so one overloaded model would close the other too
      medium: {name: gemini-3.5-flash-lite, limits: {rpm: 10, rpd: 500, tpm: 250000}}

  # Paid. Anthropic's own Messages API (x-api-key, anthropic-version), not its OpenAI-compatible
  # one: the gateway builds and checks the exact body. Sampling settings are refused on this
  # API version; the effort sits in output_config beside the answer's schema. The models think
  # before answering (it cannot be turned off on Sonnet and Opus), billed as output and counted
  # against max_tokens, hence thinking_tokens. Haiku's price holds for prompts under 100K
  # tokens, which ARGUS's (at most 60,000 characters) always are.
  - name: openai  # paid, after the free ones: their gold-set value was best on medium (D-312)
    base_url: https://api.openai.com/v1
    keys: [OPENAI_API_KEY]
    timeout_s: 120
    max_tokens_field: max_completion_tokens
    models:
      small: {name: gpt-5.4-nano, input_per_m: 0.20, output_per_m: 1.25,
              extra: {reasoning_effort: low}}
      medium: {name: gpt-5.4-mini, input_per_m: 0.75, output_per_m: 4.50,
               extra: {reasoning_effort: low}}
      large: {name: gpt-5.5, input_per_m: 5.00, output_per_m: 30.00,
              extra: {reasoning_effort: low}}  # reasoning counts against the answer's cap
    limits: {rpm: 500, tpm: 200000}

  - name: anthropic  # paid, after OpenAI: its caps take over the overflow (D-312)
    api: anthropic
    base_url: https://api.anthropic.com/v1
    keys: [ANTHROPIC_API_KEY]
    timeout_s: 120
    schema_output: true
    max_tokens_field: max_tokens
    models:
      small: {name: claude-haiku-5-5, input_per_m: 0.10, output_per_m: 0.50,
              thinking_tokens: 2048, extra: {output_config: {effort: low}}}
      medium: {name: claude-sonnet-5-5, input_per_m: 2.00, output_per_m: 10.00,
               thinking_tokens: 2048, extra: {output_config: {effort: low}}}
      large: {name: claude-opus-5-5, input_per_m: 4.00, output_per_m: 20.00,
              thinking_tokens: 4096, extra: {output_config: {effort: low}}}
    limits: {rpm: 50}

  # An optional self-hosted OpenAI-compatible model. Off by default; see docs/llm.md.
  - name: local
    enabled: false
    trust: campus
    base_url: https://127.0.0.1:18443/v1
    keys: [LOCAL_LLM_API_KEY]
    ca_file: data/tls/local-llm.crt
    timeout_s: 900
    concurrency: 1
    tasks: [evaluate, ping]
    probe: true
    slow_s: 120
    schema_output: true
    schema_required: true
    max_tokens_field: max_tokens
    models:
      small: {name: cyber-prime-1.2, context_tokens: 16384, thinking_tokens: 2048,
              max_output: 6144, max_prompt_tokens: 12000, read_tps: 45, write_tps: 11}
      medium: {name: cyber-prime-1.2, context_tokens: 16384, thinking_tokens: 2048,
               max_output: 6144, max_prompt_tokens: 12000, read_tps: 45, write_tps: 11}
    limits: {rpm: 2, rpd: 375}
