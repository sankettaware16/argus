# CI: every push and pull request must pass lint, strict types and the unit suite.
# The suite's network guard keeps every test on the loopback; nothing here reaches a SIEM.
# The integration suite needs Docker PostgreSQL and runs locally (`uv run pytest -q`).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12 and the dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .

      - name: Types (mypy --strict)
        run: uv run mypy

      - name: Unit suite and the network guard's own tests
        run: uv run pytest -q -p no:cacheprovider tests/unit tests/_guard
